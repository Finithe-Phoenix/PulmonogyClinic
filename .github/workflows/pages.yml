name: Validate and deploy demo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-fund
      - run: npm test
      - run: npm run build:pages
      - name: Install browser for demo checks
        run: npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile demo
        run: npm run test:e2e
      - name: Save browser report and demo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-browser-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload static demo
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/clinic/browser
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Explain a pending Pages activation
        if: failure()
        run: |
          echo '### Revisar configuración de GitHub Pages' >> "$GITHUB_STEP_SUMMARY"
          echo 'Si Configure Pages devuelve Not Found, abrir Settings → Pages → Source: GitHub Actions y volver a ejecutar este workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'https://github.com/Finithe-Phoenix/PulmonogyClinic/settings/pages' >> "$GITHUB_STEP_SUMMARY"

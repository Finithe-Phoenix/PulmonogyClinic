# Local PostgreSQL only. No patient records, public database port or default password.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clinic-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  clinic-db:
